[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanda"
version = "0.1.0"
description = "NANDA Agent 'Business Card' Resolver — POC"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pynacl>=1.5",
    "pyld>=2.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nanda = "nanda.cli:main"

[tool.setuptools.packages.find]
include = ["nanda*"]

[tool.setuptools.package-data]
nanda = ["ui/*.html", "contexts/*.jsonld"]
